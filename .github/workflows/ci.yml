name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build & Test (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --console=plain --no-daemon

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'build/test-results/test/*.xml'
          include_passed: true
          detailed_summary: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/

  mysql-test:
    name: MySQL (Testcontainers)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: MySQL integration tests
        run: ./gradlew mysqlTest --console=plain --no-daemon

      - name: Upload MySQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-results
          path: build/test-results/mysqlTest/*.xml
