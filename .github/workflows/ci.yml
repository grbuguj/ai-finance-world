name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build & Test (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --console=plain --no-daemon

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'build/test-results/test/*.xml'
          include_passed: true
          detailed_summary: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/

  mysql-test:
    name: MySQL (Testcontainers)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: MySQL integration tests
        run: ./gradlew mysqlTest --console=plain --no-daemon

      - name: MySQL test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: MySQL Test Report
          report_paths: 'build/test-results/mysqlTest/*.xml'
          include_passed: true
          detailed_summary: true

      - name: Upload MySQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-results
          path: build/test-results/mysqlTest/*.xml

  benchmark:
    name: Lock strategy benchmark (MySQL)
    # 8분 걸리는 실험이라 매 push 가 아니라 main/develop, PR, 수동 실행에서만
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Benchmark (H2 + MySQL)
        run: ./gradlew benchmark mysqlBenchmark --console=plain --no-daemon

      - name: Publish report to job summary
        if: always()
        run: cat build/benchmark/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: build/benchmark/

  e2e:
    name: E2E (docker compose + k6)
    # 전체 스택을 컨테이너로 띄워 실제 HTTP 부하를 건 뒤, 원장 무결성·Outbox 전량 발행·대사 일치를 확인
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    env:
      APP_PROFILES: infra,loadtest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose --profile app up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 90); do
            if curl -fs localhost:8080/actuator/health | grep -q '"UP"'; then echo "app is UP"; exit 0; fi
            sleep 2
          done
          docker compose logs app | tail -100
          exit 1

      - name: k6 load (transfer, mixed)
        run: |
          mkdir -p loadtest/results && chmod 777 loadtest/results
          for s in transfer mixed; do
            docker run --rm --network ai-finance-world_default -v "$PWD":/work -w /work grafana/k6:0.54.0 \
              run -e BASE_URL=http://app:8080 -e VUS=30 -e DURATION=30s -e LABEL=ci loadtest/k6/$s.js
          done

      - name: Verify integrity, outbox drain and reconciliation
        run: |
          curl -fs localhost:8080/integrity | tee integrity.json; echo
          grep -q '"balanced":true' integrity.json
          for i in $(seq 1 60); do
            curl -fs localhost:8080/ops/outbox > outbox.json
            if grep -q '"pending":0' outbox.json; then break; fi
            sleep 2
          done
          cat outbox.json; echo
          grep -q '"pending":0' outbox.json
          grep -q '"dead":0' outbox.json
          # Outbox 가 비어도 Kafka 소비자가 따라잡는 데 시간이 걸리므로 대사가 MATCHED 가 될 때까지 재시도
          for i in $(seq 1 30); do
            curl -fs -X POST localhost:8080/ops/reconciliation > recon.json
            if grep -q '"status":"MATCHED"' recon.json; then break; fi
            sleep 2
          done
          cat recon.json; echo
          grep -q '"status":"MATCHED"' recon.json

      - name: Lock variants on hot merchants (mixed)
        # ADR-0005: 같은 혼합 부하에서 분산 락 방식만 바꿔 실측 (앱을 설정만 바꿔 재기동)
        run: |
          run_variant() {
            label=$1; dist=$2; backoff=$3
            APP_LOCK_DISTRIBUTED_ENABLED=$dist APP_LOCK_MAX_BACKOFF_MS=$backoff \
              docker compose --profile app up -d --no-deps --force-recreate app
            for i in $(seq 1 90); do curl -fs localhost:8080/actuator/health | grep -q '"UP"' && break; sleep 2; done
            docker run --rm --network ai-finance-world_default -v "$PWD":/work -w /work grafana/k6:0.54.0 \
              run -e BASE_URL=http://app:8080 -e VUS=30 -e DURATION=30s -e LABEL=$label loadtest/k6/mixed.js
            curl -fs localhost:8080/integrity | grep -q '"balanced":true'
          }
          run_variant lock-redis-spin50 true 50
          run_variant lock-redis-spin5 true 5
          run_variant lock-db-only false 50

      - name: Results to job summary
        if: always()
        run: |
          {
            echo "## E2E load (docker compose + k6, VUS 30 × 30s)"
            for f in loadtest/results/*.json; do
              [ -f "$f" ] || continue
              python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))["metrics"]
          name = sys.argv[1].split("/")[-1]
          dur = d["http_req_duration"]["values"]
          print(f"- **{name}**: TPS {d['http_reqs']['values']['rate']:.0f}, p95 {dur['p(95)']:.1f}ms, p99 {dur['p(99)']:.1f}ms, 실패율 {d['http_req_failed']['values']['rate']*100:.2f}%")
          PY
            done
            echo; echo '```'; cat integrity.json outbox.json recon.json 2>/dev/null; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: App logs on failure
        if: failure()
        run: docker compose logs app | tail -200

      - name: Stop stack
        if: always()
        run: docker compose --profile app down -v
