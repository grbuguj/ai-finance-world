plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'ai-finance-world'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// ── MySQL 실측 테스트 ────────────────────────────────────────────
// 일반 테스트(test)는 H2 로 빠르게, mysqlTest 는 Testcontainers MySQL 에서 실제 InnoDB 락 동작을 검증한다.
// 소스셋을 분리해 Docker 가 없는 환경에서도 ./gradlew test 는 그대로 동작한다.
//   ./gradlew mysqlTest
sourceSets {
    mysqlTest {
        // src/mysqlTest/java, src/mysqlTest/resources 는 소스셋 이름으로 자동 등록된다
        // (srcDir 로 한 번 더 추가하면 Gradle 9 에서 리소스 중복 오류)
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    mysqlTestImplementation.extendsFrom testImplementation
    mysqlTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'   // 헥사고날 의존 규칙 테스트

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'   // local 프로필(메모리 DB) + 테스트용

    // 관측성: /actuator/prometheus 로 거래 지표 노출 → Prometheus 수집 → Grafana
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // MySQL 실측 테스트 (src/mysqlTest, Docker 필요)
    mysqlTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    mysqlTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    mysqlTestImplementation 'org.testcontainers:testcontainers-mysql'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// ── 락 전략 비교 실험 (오래 걸리므로 일반 테스트에서 분리) ──────────────
//   ./gradlew benchmark        (H2)
//   ./gradlew mysqlBenchmark   (Testcontainers MySQL 8, Docker 필요) → build/benchmark/*.md
tasks.register('benchmark', Test) {
    description = '락 전략 비교 실험 (H2)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'benchmark' }
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }
}

tasks.register('mysqlTest', Test) {
    description = 'Testcontainers MySQL 통합 테스트 (Docker 필요)'
    group = 'verification'
    testClassesDirs = sourceSets.mysqlTest.output.classesDirs
    classpath = sourceSets.mysqlTest.runtimeClasspath
    useJUnitPlatform { excludeTags 'benchmark' }
    shouldRunAfter tasks.named('test')
    testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.register('mysqlBenchmark', Test) {
    description = '락 전략 비교 실험 (Testcontainers MySQL, Docker 필요)'
    group = 'verification'
    testClassesDirs = sourceSets.mysqlTest.output.classesDirs
    classpath = sourceSets.mysqlTest.runtimeClasspath
    useJUnitPlatform { includeTags 'benchmark' }
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }
}
