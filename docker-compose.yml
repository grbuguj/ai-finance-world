version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai-finance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: ai_finance
      MYSQL_USER: finance
      MYSQL_PASSWORD: finance1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: ai-finance-redis
    ports:
      - "6379:6379"

  kafka:
    # KRaft 단일 노드 (Zookeeper 불필요)
    image: apache/kafka:3.8.0
    container_name: ai-finance-kafka
    ports:
      - "9092:9092"

  # ── 관측성 ─────────────────────────────────────────
  # 앱은 호스트(IntelliJ)에서 실행 → host.docker.internal:8080/actuator/prometheus 수집
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ai-finance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ai-finance-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
