name: ai-finance-world

# 사용법
#   개발: docker compose up -d                  → 인프라만 (앱은 IntelliJ 에서 infra 프로필로 실행)
#   시연: docker compose --profile app up -d --build
#         → 앱까지 컨테이너로 한 번에 (http://localhost:8080 대시보드, :3000 Grafana)

services:
  mysql:
    image: mysql:8.0
    container_name: ai-finance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: ai_finance
      MYSQL_USER: finance
      MYSQL_PASSWORD: finance1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufinance", "-pfinance1234"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2
    container_name: ai-finance-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # KRaft 단일 노드 (Zookeeper 불필요)
    # 리스너 2개: 컨테이너 안(앱 컨테이너)은 kafka:29092, 호스트(IntelliJ 실행 앱)는 localhost:9092
    image: apache/kafka:3.8.0
    container_name: ai-finance-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ── 앱 (시연용: --profile app) ─────────────────────────
  app:
    profiles: ["app"]
    build: .
    container_name: ai-finance-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-infra}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_finance?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: finance1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_CHAOS_ENABLED: "true"   # 시연용 장애 주입 버튼 활성화
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # ── 관측성 ─────────────────────────────────────────
  # 앱이 컨테이너면 app:8080, 호스트(IntelliJ)면 host.docker.internal:8080 을 수집 (둘 중 떠 있는 쪽)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ai-finance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ai-finance-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
