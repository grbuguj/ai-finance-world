# Testcontainers MySQL 통합 테스트 전용 (접속 정보는 @ServiceConnection 이 주입)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.simulation.auto-start=false
app.redis.enabled=false
app.kafka.enabled=false

# mysqlTest 클래스패스에서는 main 의 application.properties 가 test 쪽보다 먼저 잡히므로
# 테스트가 직접 제어해야 하는 배경 작업은 여기서 다시 꺼 준다
app.outbox.relay.auto=false
app.eod.enabled=false
app.chaos.enabled=true
app.integrity.monitor.enabled=false
