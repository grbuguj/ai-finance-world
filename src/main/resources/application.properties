# 프로필을 따로 지정하지 않으면 local(H2 메모리 DB)로 실행 → IntelliJ 실행 버튼만 눌러도 켜짐
# MySQL 로 실행하려면 --spring.profiles.active=mysql (또는 infra)
spring.profiles.default=local

spring.datasource.url=jdbc:mysql://localhost:3306/ai_finance?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=finance
spring.datasource.password=finance1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
# OSIV 끄기: 켜져 있으면 HTTP 요청 내내 영속성 컨텍스트가 살아 있어, 락 없이 먼저 읽은 계좌 엔티티가
# 이후 SELECT ... FOR UPDATE 결과로 그대로 재사용된다(낡은 잔액). 실제 HTTP 동시 결제에서 재현 — HttpSpendConcurrencyTest
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=localhost:9092

spring.data.redis.host=localhost
spring.data.redis.port=6379


# ── 시뮬레이션 ──────────────────────────────────────────
app.simulation.auto-start=true
# 몇 틱마다 급여를 지급할지 / 급여 = 초기 잔액 × salary-rate
app.simulation.payday-interval-ticks=10
app.simulation.salary-rate=0.05
# 투자 수익률 r ~ N(mean, stddev^2)
app.invest.mean-return=0.02
app.invest.stddev-return=0.10

# ── 외부 인프라 (기본 OFF: MySQL 만 있어도 실행 가능) ─────
# 켜려면: --spring.profiles.active=infra  (application-infra.properties)
app.redis.enabled=false
app.kafka.enabled=false
app.kafka.topic=ai-finance.transactions
app.kafka.send-timeout-ms=3000
app.lock.wait-ms=3000
app.lock.lease-ms=5000

# ── 관측성 (Actuator + Prometheus) ─────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=ai-finance-world

# ── 멱등성 키 ─────────────────────────────────────────
app.idempotency.retention-hours=24
app.idempotency.wait-ms=5000

# ── 스케줄러 스레드 풀 ─────────────────────────────────
# 기본값(1개)이면 시뮬레이션 틱 / Outbox 릴레이 / EOD 배치가 한 스레드를 나눠 써서
# 브로커 장애로 릴레이가 타임아웃을 기다리는 동안 시뮬레이션까지 멈춘다 → 분리
spring.task.scheduling.pool.size=4

# ── Transactional Outbox ─────────────────────────────
app.outbox.relay.auto=true
app.outbox.relay.interval-ms=100
app.outbox.relay.batch-size=200
app.outbox.relay.max-attempts=10

# ── 일마감(EOD) 대사 배치 ────────────────────────────
app.eod.enabled=true
app.eod.cron=0 10 0 * * *

# ── 장애 주입 API (/chaos/**) — 시연용. 운영에서는 반드시 false ──
app.chaos.enabled=false

# ── 대시보드 통계 / 무결성 감시 ────────────────────────
# /stats 는 1초 스냅샷, 무결성 검증은 5초 주기 (요청마다 원장 전체 집계하지 않음)
app.dashboard.stats-refresh-ms=1000
app.dashboard.integrity-max-age-ms=5000
app.integrity.monitor.enabled=true
app.integrity.check-interval-ms=5000
