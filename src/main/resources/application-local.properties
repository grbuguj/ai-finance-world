# MySQL 없이 실행하는 로컬/시연용 프로필 (H2 인메모리 DB - 종료하면 데이터 초기화)
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#   IntelliJ: Run Configuration > Active profiles 에 local 입력
spring.datasource.url=jdbc:h2:mem:aifinance;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 로컬 시연에서는 장애 주입 API 를 켠다 (/chaos/broker/down, /up, /ack-loss)
app.chaos.enabled=true
