spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# 테스트에서는 스케줄러가 스스로 틱을 돌리지 않도록 정지 상태로 시작 (테스트가 runTick() 을 직접 호출)
app.simulation.auto-start=false

# Outbox 릴레이·EOD 배치는 테스트가 직접 호출해 결정적으로 검증한다
app.outbox.relay.auto=false
app.eod.enabled=false
app.chaos.enabled=true
app.integrity.monitor.enabled=false
# 운영 설정과 동일하게 OSIV 끔 (이 파일은 main 의 application.properties 를 통째로 가리므로 명시 필요)
spring.jpa.open-in-view=false
